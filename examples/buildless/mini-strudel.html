<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mini Strudel</title>
  <script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #1a1a2e;
      color: #eee;
      font-family: monospace;
      height: 100vh;
      display: flex;
      flex-direction: row;
    }

    /* Sidebar */
    #sidebar {
      width: 250px;
      background: #16213e;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #0f3460;
    }
    .sidebar-header {
      padding: 10px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      gap: 8px;
    }
    .sidebar-header button {
      flex: 1;
      padding: 8px;
      font-size: 12px;
    }
    #patterns {
      flex: 1;
      overflow-y: auto;
    }
    .song-group {
      border-bottom: 1px solid #0f3460;
    }
    .song-header {
      padding: 10px;
      background: #1a1a2e;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .song-header:hover { background: #0f3460; }
    .song-header.active { border-left: 3px solid #e94560; }
    .song-title {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .song-count {
      font-size: 10px;
      color: #888;
      margin-left: 8px;
    }
    .pattern-list {
      display: none;
    }
    .pattern-list.expanded { display: block; }
    .pattern-item {
      padding: 8px 10px 8px 20px;
      font-size: 11px;
      cursor: pointer;
      border-bottom: 1px solid #0f3460;
    }
    .pattern-item:hover { background: #0f3460; }
    .pattern-item.active { background: #e94560; }
    .pattern-item { position: relative; }
    .pattern-delete {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 12px;
      opacity: 0;
    }
    .pattern-item:hover .pattern-delete { opacity: 1; }
    .pattern-delete:hover { color: #e94560; background: transparent; }
    .pattern-preview {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #7ec8e3;
    }
    .pattern-time {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    /* Main area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .toolbar {
      padding: 10px;
      display: flex;
      gap: 10px;
      background: #16213e;
    }
    button {
      padding: 8px 20px;
      background: #0f3460;
      color: #eee;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 14px;
    }
    button:hover { background: #e94560; }
    strudel-editor {
      flex: 1;
      display: block;
    }
    #status {
      padding: 10px;
      background: #16213e;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <button id="newSong">+ New Song</button>
    </div>
    <div id="patterns"></div>
  </div>

  <div id="main">
    <div class="toolbar">
      <button id="play">▶ Play (Ctrl+Enter)</button>
      <button id="stop">■ Stop</button>
    </div>
    <strudel-editor id="editor">
<!--
// Fireproof Drive
stack(
  // drums
  stack(
    s("bd ~ bd ~, ~ sd ~ sd").bank("RolandTR909").gain(0.2),
    s("hh*16").degradeBy(0.3)

  // bass
  note("g1 ~ g1 g1 ~ g1 g1 ~")

    .decay(0.15).sustain(0),
  // chords
  chord("<Gm7 Cm7 Dm7 Cm7>/2")
    .voicing()
    .sound("sawtooth")
    .lpf(sine.range(600, 1800).slow(8))
    .decay(0.3).sustain(0.2).release(0.5)
    .gain(0.4),
  // lead
  note("g3 bb3 d4 g4 d4 bb3 g3 d3").euclid(5,8)

    .room(0.45)
    .release(0.25)
    .lpf(2000)
)._pianoroll({ labels: 1 })

    </strudel-editor>
    <div id="status">Loading Strudel...</div>
  </div>

  <script type="module">
    import { fireproof } from 'https://esm.sh/use-fireproof';

    const db = fireproof('mini-strudel');
    let currentSongId = null;
    let editorInstance = null;

    // Wait for strudel-editor to be ready
    await customElements.whenDefined('strudel-editor');
    const editorEl = document.getElementById('editor');

    // Get editor instance once it's ready
    const waitForEditor = setInterval(() => {
      if (editorEl.editor) {
        editorInstance = editorEl.editor;
        clearInterval(waitForEditor);
        document.getElementById('status').textContent = 'Ready - Ctrl+Enter to play, Ctrl+S to save';
      }
    }, 100);

    // Helper: get code from editor
    function getEditorCode() {
      return editorInstance?.code || '';
    }

    // Helper: set code in editor
    function setEditorCode(code) {
      if (editorInstance) {
        editorInstance.setCode(code);
      }
    }

    // Helper: generate preview from code
    function generatePreview(code) {
      if (!code) return '(empty)';
      const titleMatch = code.match(/^\/\/\s*(.+)$/m);
      if (titleMatch) return titleMatch[1].trim();
      const firstLine = code.split('\n').find(l => l.trim()) || '';
      return firstLine.trim().substring(0, 40) + (firstLine.length > 40 ? '...' : '');
    }

    // Helper: format timestamp
    function formatTime(ts) {
      const diff = Date.now() - ts;
      const mins = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      if (hours < 24) return `${hours}h ago`;
      return `${days}d ago`;
    }

    // Save pattern
    async function savePattern() {
      const code = getEditorCode();
      if (!code.trim()) return;

      const pattern = {
        type: 'pattern',
        code,
        songId: currentSongId,
        timestamp: Date.now(),
        preview: generatePreview(code)
      };

      const result = await db.put(pattern);

      // If this was a new song (songId was null), this pattern becomes the song root
      if (currentSongId === null) {
        currentSongId = result.id;
      }

      document.getElementById('status').textContent = `Saved! (${formatTime(Date.now())})`;
      await renderSidebar();
    }

    // Load and render sidebar
    async function renderSidebar() {
      const result = await db.query(
        (doc) => doc.type === 'pattern' ? doc.timestamp : null,
        { descending: true }
      );

      // Group patterns by song
      const songs = new Map(); // songId -> { root: pattern, children: [] }

      result.rows.forEach(row => {
        const doc = row.doc || row.value;
        const pattern = {
          _id: row.id || doc._id,
          code: doc.code,
          songId: doc.songId,
          timestamp: doc.timestamp,
          preview: doc.preview
        };

        if (pattern.songId === null) {
          // This is a song root
          if (!songs.has(pattern._id)) {
            songs.set(pattern._id, { root: pattern, children: [] });
          } else {
            songs.get(pattern._id).root = pattern;
          }
        } else {
          // This belongs to a song
          if (!songs.has(pattern.songId)) {
            songs.set(pattern.songId, { root: null, children: [pattern] });
          } else {
            songs.get(pattern.songId).children.push(pattern);
          }
        }
      });

      // Render
      const container = document.getElementById('patterns');
      container.innerHTML = '';

      if (songs.size === 0) {
        container.innerHTML = '<div style="padding: 20px; color: #666; text-align: center;">No songs yet.<br>Press Ctrl+S to save.</div>';
        return;
      }

      songs.forEach((song, songId) => {
        const isActive = currentSongId === songId;
        const allPatterns = song.root ? [song.root, ...song.children] : song.children;
        allPatterns.sort((a, b) => b.timestamp - a.timestamp);

        const group = document.createElement('div');
        group.className = 'song-group';

        const header = document.createElement('div');
        header.className = 'song-header' + (isActive ? ' active' : '');
        header.innerHTML = `
          <span class="song-title">${song.root?.preview || 'Song'}</span>
          <span class="song-count">${allPatterns.length}</span>
        `;
        header.onclick = () => {
          const list = group.querySelector('.pattern-list');
          list.classList.toggle('expanded');
        };

        const list = document.createElement('div');
        list.className = 'pattern-list' + (isActive ? ' expanded' : '');

        allPatterns.forEach(p => {
          const item = document.createElement('div');
          item.className = 'pattern-item' + (currentSongId === songId ? '' : '');
          item.innerHTML = `
            <div class="pattern-preview">${p.preview}</div>
            <div class="pattern-time">${formatTime(p.timestamp)}</div>
            <button class="pattern-delete">✕</button>
          `;
          item.querySelector('.pattern-delete').onclick = async (e) => {
            e.stopPropagation();
            await db.del(p._id);
            await renderSidebar();
          };
          item.onclick = (e) => {
            if (e.target.classList.contains('pattern-delete')) return;
            e.stopPropagation();
            setEditorCode(p.code);
            currentSongId = p.songId === null ? p._id : p.songId;
            renderSidebar();
            // Auto-play the loaded pattern
            setTimeout(() => {
              document.dispatchEvent(new CustomEvent('repl-evaluate'));
              document.getElementById('status').textContent = 'Playing...';
            }, 50);
          };
          list.appendChild(item);
        });

        group.appendChild(header);
        group.appendChild(list);
        container.appendChild(group);
      });
    }

    // Event handlers
    document.getElementById('play').onclick = () => {
      document.dispatchEvent(new CustomEvent('repl-evaluate'));
      document.getElementById('status').textContent = 'Playing...';
    };

    document.getElementById('stop').onclick = () => {
      document.dispatchEvent(new CustomEvent('repl-stop'));
      document.getElementById('status').textContent = 'Stopped';
    };

    document.getElementById('newSong').onclick = () => {
      currentSongId = null;
      setEditorCode('// New Song\n');
      renderSidebar();
      document.getElementById('status').textContent = 'New song - Ctrl+S to save';
    };

    // Ctrl+S to save
    document.addEventListener('keydown', async (e) => {
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        await savePattern();
      }
    });

    // Live updates
    db.subscribe(async () => {
      await renderSidebar();
    });

    // Initial render
    await renderSidebar();
  </script>
</body>
</html>
